# ============================================================================
# Nginx Configuration for Creatools
# Handles 3 domains: creatools.co, creatools.stream, creatools.live
# All point to the same application (SPA + API on /api)
# ============================================================================

# Upstream for the Node.js API server (PM2 cluster on port 8080)
upstream creatools_api {
    server 127.0.0.1:8080;
    keepalive 64;
}

# HTTP to HTTPS redirect for all domains
server {
    listen 80;
    listen [::]:80;
    server_name creatools.co www.creatools.co creatools.stream www.creatools.stream creatools.live www.creatools.live;

    # Allow Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main site - creatools.co
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name creatools.co www.creatools.co;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/creatools.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creatools.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend static files root
    root /opt/creatools/frontend;
    index index.html;

    # API reverse proxy
    location /api {
        proxy_pass http://creatools_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Rate limiting for API
        limit_req zone=api burst=50 nodelay;
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

