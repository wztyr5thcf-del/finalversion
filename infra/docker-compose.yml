services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    restart: always
    volumes:
      - static_html:/app/static-export
      - uploads:/app/uploads
      - appdata:/app/artifacts/api-server/data
    entrypoint: ["/bin/sh", "-c", "rm -rf /app/static-export/* && cp -r /app/public/* /app/static-export/ && exec node --enable-source-maps ./dist/index.mjs"]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_html:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: always

volumes:
  static_html:
  uploads:
  appdata:
