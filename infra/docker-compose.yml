services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: always
    volumes:
      - static_html:/app/static-export
    entrypoint: ["/bin/sh", "-c", "rm -rf /app/static-export/* && cp -r /app/public/* /app/static-export/ && exec node --enable-source-maps ./dist/index.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_html:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: always

volumes:
  static_html:
